apis:
- aid: assertible:assertible-api
  name: Assertible API
  description: >-
    Assertible's public programmatic surface, used to drive test runs from a
    CI/CD pipeline. It consists of two documented POST operations on
    assertible.com: a trigger URL that runs a web service's tests
    (POST /apis/{serviceId}/run) and a sync call that re-imports an OpenAPI,
    Swagger or Postman specification and updates the tests derived from it
    (POST /imports/{importId}/sync). Both authenticate with HTTP Basic using an
    Assertible API token as the username. There are no read operations: web
    services, tests, imports, environments, schedules and alert hooks are created
    and listed in the dashboard only. Assertible's own /docs/api page states the
    broader API is "under construction".
  humanURL: https://assertible.com/
  baseURL: https://assertible.com
