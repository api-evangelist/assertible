specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Assertible
providerId: assertible
generated: '2026-09-04'
method: searched
source: https://assertible.com/plans
created: '2026-05-04'
modified: '2026-09-04'
# 2026-09-04: this file previously held a bulk-sweep SCAFFOLD (invented
# Free/Professional/Enterprise tiers with "TBD" prices and invented monthly
# request quotas). It has been replaced in full with the four tiers Assertible
# actually publishes on https://assertible.com/plans, read from the pricing
# table on 2026-09-04. No value below is inferred.
tags:
  - API Testing
  - Monitoring
  - Quality Assurance
  - Testing
  - CI/CD
description: >-
  Assertible publishes four self-serve plans on a single public pricing page.
  Tiers are differentiated by product capacity — number of web services, tests
  per service, retained test results, team members and monitoring schedule
  frequency — not by API call volume. Assertible states explicitly that it does
  not cap request counts.
currency: USD
billing_period: month
plan_count: 4
metering_basis: capacity
metering_note: >-
  From the pricing FAQ: "Do you have request limits per month? Instead of
  limiting the number of requests you can make, limits are placed on the number
  of results you can see for those requests, the number of tests you can create,
  how frequently you can run schedules, etc."
plans:
  - id: assertible-personal
    name: Personal
    type: free
    price: '0.00'
    currency: USD
    billing_period: month
    description: >-
      Free tier for an individual. Assertible's FAQ states it can be used free
      "Forever".
    entries:
      - label: Web services
        name: web_services
        type: quota
        metric: web_services
        limit: 2
      - label: Tests per service
        name: tests_per_service
        type: quota
        metric: tests
        limit: 10
      - label: Result retention
        name: result_retention
        type: quota
        metric: retained_results
        limit: 1000
      - label: Members
        name: members
        type: quota
        metric: members
        limit: 2
        note: Published as "1-2".
      - label: Schedule frequency
        name: schedule_frequency
        type: feature
        value: Standard (2 monitors)
        note: >-
          Schedules of once per minute, once per 5 minutes and once per 15
          minutes are documented as available only on paid plans; once per 30
          minutes, hourly and daily are available on all plans.
          Source https://assertible.com/docs/guide/automation#schedules
  - id: assertible-standard
    name: Standard
    type: paid
    price: '25.00'
    currency: USD
    billing_period: month
    trial: 1 month free trial
    description: >-
      Keep tabs on your API and web applications with enhanced monitoring and
      higher result retention.
    entries:
      - label: Web services
        name: web_services
        type: quota
        metric: web_services
        limit: 25
      - label: Tests per service
        name: tests_per_service
        type: quota
        metric: tests
        limit: 500
      - label: Result retention
        name: result_retention
        type: quota
        metric: retained_results
        limit: 5000
      - label: Members
        name: members
        type: quota
        metric: members
        limit: 1
      - label: Schedule frequency
        name: schedule_frequency
        type: feature
        value: Upgraded
  - id: assertible-startup
    name: Startup
    type: paid
    price: '50.00'
    currency: USD
    billing_period: month
    trial: 1 month free trial
    description: >-
      Add team members from your organization to collaborate on API testing and
      monitoring your web services.
    entries:
      - label: Web services
        name: web_services
        type: quota
        metric: web_services
        limit: 25
      - label: Tests per service
        name: tests_per_service
        type: quota
        metric: tests
        limit: 500
      - label: Result retention
        name: result_retention
        type: quota
        metric: retained_results
        limit: 5000
      - label: Members
        name: members
        type: quota
        metric: members
        limit: 10
      - label: Schedule frequency
        name: schedule_frequency
        type: feature
        value: Upgraded
  - id: assertible-business
    name: Business
    type: paid
    price: '100.00'
    currency: USD
    billing_period: month
    trial: 1 month free trial
    description: >-
      Work across your organization to build a robust testing and QA pipeline for
      your most critical web services.
    entries:
      - label: Web services
        name: web_services
        type: quota
        metric: web_services
        limit: 50
      - label: Tests per service
        name: tests_per_service
        type: quota
        metric: tests
        limit: 1000
      - label: Result retention
        name: result_retention
        type: quota
        metric: retained_results
        limit: 10000
      - label: Members
        name: members
        type: quota
        metric: members
        limit: 20
      - label: Schedule frequency
        name: schedule_frequency
        type: feature
        value: Upgraded
commercial_terms:
  per_user_fees: false
  per_user_note: >-
    "No, there is only one monthly charge per account. Each plan has a limited
    number of members you can invite."
  proration: true
  proration_note: >-
    "When you upgrade or downgrade your account, all charges are automatically
    pro-rated."
  cancel_anytime: true
  payment_methods:
    - Visa
    - MasterCard
    - American Express
    - Discover
  payment_methods_excluded:
    - PayPal
    - Purchase order invoices
  enterprise_contact: >-
    No published enterprise tier. The FAQ directs customers needing higher limits
    to "reach out and let us know - we can get you set up."
  source: https://assertible.com/plans
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
